<style id="viewer-style">
/* ═══ Common · 사진 크게 보기 ═══════════════════════════════════════════ */
#viewer{--screen-bg:#0f0d0b;color:#f6f1e9}
#viewer .top-app-bar{background:transparent;color:#f6f1e9;position:relative;z-index:2}
#viewer .top-app-bar .icon-btn{color:#f6f1e9}
#viewer .top-app-bar .title{line-height:1.25;font:600 15px/1.3 var(--font-body)}
#viewer .top-app-bar .title span{display:flex;align-items:center;gap:4px;margin-top:2px;font:var(--body-s);color:#c9bfb2}
#viewer .top-app-bar .title span .ms{--ms-size:14px}
#viewer .top-app-bar .title i{width:8px;height:8px;border-radius:50%;background:var(--c,#8a7d70);display:inline-block}
#viewer .content{padding:0;overflow:hidden;display:flex;flex-direction:column}
.vw-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.vw-track::-webkit-scrollbar{display:none}
.vw-slide{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;padding:12px 0}
.vw-slide i{display:block;width:100%;aspect-ratio:3/4;max-height:100%;position:relative}
.vw-slide i .star{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:4px;padding:6px 10px 6px 8px;border-radius:999px;background:#fffdf9;color:#7a4f05;font:600 12px/1 var(--font-body)}
.vw-slide i .star .ms{--ms-size:16px;color:#d18a0c}
.vw-count{align-self:center;margin:6px 0 10px;padding:6px 12px;border-radius:999px;background:rgba(246,241,233,.12);font:var(--label-m);color:#e9e1d4}
#viewer .bottom-bar{background:#0f0d0b;justify-content:space-around;padding-top:6px;gap:0}
.vw-act{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;min-height:56px;padding:6px 4px;border:0;border-radius:16px;background:transparent;color:#f6f1e9;font:var(--label-m);cursor:pointer}
.vw-act .ms{--ms-size:24px}
.vw-act.on .ms{color:#f2b33d}
.vw-act.warn{color:#ffb4a8}
/* 여행에서 빼기: 70% 동안 둥글게 줄며 그날 색으로 물들고, 남은 30% 동안 방울이 떨어지며 사라짐 (0.8s) */
.vw-slide i.out{animation:vw-out .8s cubic-bezier(.4,0,.2,1) forwards;overflow:hidden}
.vw-slide i.out::after{content:"";position:absolute;inset:0;background:var(--d);animation:vw-tint .8s forwards}
@keyframes vw-out{0%{transform:none;clip-path:circle(75% at 50% 50%)}70%{transform:scale(.18);clip-path:circle(37.5% at 50% 50%);opacity:1}100%{transform:translateY(220px) scale(.18);clip-path:circle(37.5% at 50% 50%);opacity:0}}
@keyframes vw-tint{0%{opacity:0}70%{opacity:1}100%{opacity:1}}
#viewer.leaving .top-app-bar,#viewer.leaving .vw-count,#viewer.leaving .bottom-bar{opacity:0;transition:opacity .8s}
</style>
