<style id="trips-style">
/* ═══ Flow 4 · 여행 목록 (메인) ═══════════════════════════════════════ */
#trips .top-app-bar .title{font:700 22px/1.35 var(--font-display);letter-spacing:-.3px}
#trips .content{padding:0 16px 24px}
.tr-dock{width:40px;height:40px;flex:none}
/* the trip globe floats above the list: big in the header, docked in the app bar once you scroll */
.tr-globe{position:absolute;left:0;top:0;width:200px;height:200px;z-index:3;transform-origin:0 0;cursor:pointer;touch-action:manipulation}
.tr-hero{display:flex;flex-direction:column;align-items:center;padding:4px 0 14px}
.tr-slot{position:relative;width:200px;height:200px}
.tr-slot::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed var(--outline-variant)}
.tr-sum{margin-top:10px;font:var(--body-l);color:var(--on-surface-variant)}
.tr-sum b{font:700 20px/1 var(--font-display);color:var(--on-surface);margin:0 1px 0 0}
.tr-hint{margin-top:4px;font:var(--label-m);color:var(--on-surface-variant);opacity:.85}

.tr-year{display:flex;align-items:baseline;gap:8px;margin:18px 4px 10px}
.tr-year b{font:700 22px/1 var(--font-display)}
.tr-year span{font:var(--label-m);color:var(--on-surface-variant)}

/* trip card = a ticket: photos on top, perforation, then where · when · how many */
.tc{display:block;width:100%;border:0;padding:0;margin:0 0 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--surface-container-lowest);border-radius:20px;box-shadow:0 1px 0 var(--outline-variant);overflow:hidden;transition:box-shadow .35s}
.tc.on{box-shadow:0 0 0 2px var(--c),0 6px 18px -10px rgba(31,26,22,.35)}
.tc-ph{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:124px}
.tc-ph i{display:block}
.tc-ph i:first-child{grid-row:1/3}
.tc-ph .more{position:relative}
.tc-ph .more b{position:absolute;inset:0;display:grid;place-items:center;background:rgba(31,26,22,.45);color:#fff;font:600 14px/1 var(--font-body)}
.tc-row{display:flex;align-items:center;gap:14px;padding:12px 16px 14px 18px}
.tc-row .tk-dot{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tc.on .tk-dot{transform:scale(1.18)}
.tc-main{flex:1;min-width:0}
.tc-name{display:flex;align-items:center;gap:2px;min-width:0}
.tc-main b{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 19px/1.2 var(--font-display)}
.tc-edit{flex:none;display:grid;place-items:center;width:40px;height:40px;margin:-10px -8px -10px 0;border:0;border-radius:50%;background:none;color:var(--on-surface-variant);cursor:pointer}
.tc-edit .ms{--ms-size:18px;opacity:.75}
.tc-edit:active{background:var(--surface-container)}
.tc-main>span:last-child{display:block;margin-top:3px;font:var(--body-s);color:var(--on-surface-variant)}
.tc-n{font:600 15px/1 var(--font-body)}

.tr-part{display:flex;gap:12px;align-items:center;margin:4px 0 6px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--surface-container-low);font:var(--body-m)}
.tr-part .ms{--ms-size:20px;color:var(--primary)}
.tr-part span{flex:1}
.tr-part .btn{min-height:40px;padding:0 14px}
.tr-empty{text-align:center;padding:28px 20px;color:var(--on-surface-variant);font:var(--body-m)}
.tr-empty b{display:block;margin-bottom:6px;font:700 19px/1.3 var(--font-display);color:var(--on-surface)}
.tr-left{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:8px;padding:0 8px 0 16px;border:0;border-radius:16px;background:transparent;
  font:var(--body-m);color:var(--on-surface-variant);text-align:left;cursor:pointer;border:1.5px dashed var(--outline-variant)}
.tr-left .ms{--ms-size:20px}
.tr-left span{flex:1}
.tc.renamed{--d:var(--c)}
</style>
