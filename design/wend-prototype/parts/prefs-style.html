<style id="prefs-style">
/* ═══ Flow 7 · 설정 ═══════════════════════════════════════════════════ */
#prefs .content{padding:4px 0 32px}
.pf-me{display:flex;align-items:center;gap:16px;margin:4px 16px 8px;padding:14px 8px 14px 14px;border-radius:20px;background:var(--surface-container-low)}
.pf-me canvas{width:64px;height:64px;flex:none}
.pf-me .body{flex:1;min-width:0}
.pf-me .body b{display:block;font:700 19px/1.3 var(--font-display)}
.pf-me .body>span{display:block;margin-top:2px;font:var(--body-s);color:var(--on-surface-variant)}
.pf-sec{padding:20px 20px 6px;font:600 13px/1 var(--font-body);color:#9a2a14;letter-spacing:.2px}
.pf-row{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:8px 16px 8px 20px;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pf-row>.ms{--ms-size:22px;color:var(--on-surface-variant);flex:none}
.pf-row .body{flex:1;min-width:0}
.pf-row .body b{display:block;font:500 16px/1.35 var(--font-body)}
.pf-row .body span{display:block;margin-top:2px;font:var(--body-s);color:var(--on-surface-variant)}
.pf-row .state{display:inline-flex;align-items:center;gap:4px;font:600 13px/1 var(--font-body);color:#1d7a62;white-space:nowrap}
.pf-row .state.some{color:#8a5a00}.pf-row .state.none{color:var(--error)}
.pf-row .state .ms{--ms-size:16px}
.pf-row.danger b{color:var(--error)}
.pf-row.danger>.ms{color:var(--error)}
.pf-row .switch{flex:none}
.pf-div{height:1px;margin:0 20px 0 58px;background:var(--outline-variant)}
.pf-ver{padding:20px;text-align:center;font:var(--body-s);color:var(--on-surface-variant)}
.pf-steps{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px;font:var(--body-m)}
.pf-steps div{display:flex;gap:10px;align-items:center}
.pf-steps i{width:24px;height:24px;border-radius:50%;background:var(--surface-container-high);display:grid;place-items:center;font:700 12px/1 var(--font-body);font-style:normal;flex:none}
.pf-say{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.pf-say svg{width:40px;height:40px;flex:none}
.pf-say .bub{max-width:none;font:var(--body-m)}
#prefs-name .btn.text,#prefs-wipe .btn.text,#prefs-rescan .btn.text,#tag-sheet .btn.text{color:#9a2a14}
#prefs-wipe .btn.text.del{color:var(--error)}
</style>
