<script id="trip-js">
/* ═══ Flow 5 · 여행 상세 ═══════════════════════════════════════════════
   Signature: the trip read in the order it happened. Sections follow time (day → place), the paper map above keeps the
   whole route in faint day colours, and as you scroll 핀 walks the route to the place you're reading — the walked part
   turns solid. Scrolling the trip = moving through it. */
var DAYC = ['#e2553a', '#2f7fd8', '#2bae8e'], DAYT = ['#b8391f', '#1f63b3', '#1d7a62'];   // map colours · text-safe shades
var BUSAN = {
  days: [
    { label: '1일째', date: '5월 3일 일요일' },
    { label: '2일째', date: '5월 4일 월요일' },
    { label: '3일째', date: '5월 5일 화요일 · 어린이날' },
  ],
  stops: [   // x,y on the map (lon/lat projected); ph = stand-in photos; sc = scenes: photo numbers shot again and again (similar photos)
    { d: 0, place: '부산역', when: '오전 11:20', n: 6, x: 97, y: 119, ph: ['p-city', 'p-cafe', 'p-city', 'p-sky', 'p-cafe', 'p-food'], sc: [[0, 1, 2], [4, 5]] },
    { d: 0, place: '감천문화마을', when: '오후 1:40 – 3:30', n: 38, x: 51, y: 151, ph: ['p-sky', 'p-city', 'p-sky', 'p-cafe', 'p-dusk', 'p-food'], sc: [[0, 1, 2, 3, 4], [10, 11, 12]] },
    { d: 0, place: '남포동 · 자갈치시장', when: '오후 5:10 – 7:00', n: 21, x: 85, y: 150, ph: ['p-food', 'p-food', 'p-city', 'p-dusk', 'p-food', 'p-cafe'] },
    { d: 1, place: '해운대', when: '오전 9:50 – 12:10', n: 34, x: 283, y: 40, ph: ['p-sea', 'p-sea', 'p-sky', 'p-sea', 'p-food', 'p-cafe'], sc: [[0, 1, 2, 3], [4, 5]] },
    { d: 1, place: '청사포', when: '오후 2:00 – 4:20', n: 29, x: 332, y: 36, ph: ['p-sea', 'p-sky', 'p-sea', 'p-forest', 'p-cafe', 'p-sea'], sc: [[1, 2, 3]] },
    { d: 1, place: '광안리', when: '오후 7:30 – 9:40', n: 31, x: 218, y: 51, ph: ['p-dusk', 'p-city', 'p-dusk', 'p-dusk', 'p-food', 'p-city'], sc: [[0, 1, 2, 3, 4]] },
    { d: 2, place: '흰여울문화마을', when: '오전 10:30 – 12:00', n: 19, x: 107, y: 186, ph: ['p-sea', 'p-sky', 'p-sea', 'p-cafe', 'p-sky', 'p-sea'], sc: [[0, 1, 2]] },
    { d: 2, place: '부산역', when: '오후 3:10', n: 8, x: 97, y: 119, ph: ['p-city', 'p-food', 'p-cafe', 'p-city', 'p-sky', 'p-cafe'] },
  ],
};
BUSAN.stops.forEach(function (s) { s.auto = s.place; });   // the name Wend gave it; renames keep it for "처음 이름"
App.state.best = {};   // chosen best shots: key → {s, k}. One per scene ("stop:scene"), or a single photo picked in the viewer ("stop:kN"). The app never pre-picks.
function sceneOf(s, k) {
  var sc = BUSAN.stops[s].sc || [];
  for (var i = 0; i < sc.length; i++) if (sc[i].indexOf(k) >= 0) return i;
  return -1;
}
function bestKey(s, k) { var i = sceneOf(s, k); return s + ':' + (i >= 0 ? i : 'k' + k); }
function isBest(s, k) { var b = App.state.best[bestKey(s, k)]; return !!b && b.k === k; }
App.state.bestDone = false;
App.state.removed = BUSAN.stops.map(function () { return 0; });

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
var TP = { segs: [], cum: [0], total: 0, L: 0, Lwant: 0, intro: 1 };

/* map: one curved segment per move; overnight moves (day changes) drawn as a dotted line */
function buildMap() {
  var routes = document.getElementById('tp-routes'), stopsG = document.getElementById('tp-stops'), S = BUSAN.stops;
  routes.innerHTML = ''; stopsG.innerHTML = ''; TP.segs = []; TP.cum = [0];
  for (var i = 0; i < S.length - 1; i++) {
    var a = S[i], b = S[i + 1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
    var bend = a.x === b.x && a.y === b.y ? 0 : .18, cx = mx - dy * bend, cy = my + dx * bend;
    var d = 'M' + a.x + ' ' + a.y + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b.x + ' ' + b.y;
    var night = a.d !== b.d, col = DAYC[b.d];
    var all = svgEl('path', { d: d, class: night ? 'r-night' : 'r-all', stroke: night ? '' : col });
    var go = svgEl('path', { d: d, class: 'r-go', stroke: night ? '#8a7d70' : col });
    if (night) go.setAttribute('stroke-dasharray', '2 5');
    routes.appendChild(all); routes.appendChild(go);
    var len = go.getTotalLength();
    TP.segs.push({ go: go, all: all, len: len, night: night });
    TP.cum.push(TP.cum[i] + len);
  }
  TP.total = TP.cum[TP.cum.length - 1];
  placeStopNumbers();
}
/* stop numbers sit on the map as HTML (crisp at any scale); positions follow the SVG's "slice" scaling */
function mapScale() {
  var w = document.getElementById('tp-map').offsetWidth || 412, sc = Math.max(w / 380, 1);
  return { sc: sc, ox: (w - 380 * sc) / 2, oy: (220 - 220 * sc) / 2 };
}
function placeStopNumbers() {
  var box = document.getElementById('tp-nums'), m = mapScale(), sc = m.sc, ox = m.ox, oy = m.oy;
  box.innerHTML = BUSAN.stops.map(function (s, i) {
    if (i === BUSAN.stops.length - 1 && s.x === BUSAN.stops[0].x && s.y === BUSAN.stops[0].y) return '';   // back at the station: one dot is enough
    return '<span data-i="' + i + '" style="--d:' + DAYT[s.d] + ';background:' + DAYT[s.d] + ';left:' + (ox + s.x * sc).toFixed(1) + 'px;top:' + (oy + s.y * sc).toFixed(1) + 'px">' + (i + 1) + '</span>';
  }).join('');
}
function drawRoute(L, intro) {
  TP.segs.forEach(function (sg, i) {
    var drawn = Math.max(0, Math.min(sg.len, L - TP.cum[i]));
    if (!sg.night) sg.go.style.strokeDasharray = drawn + ' ' + (sg.len + 1);
    else sg.go.style.opacity = drawn > 0 ? 1 : 0;
    // intro: the faint full route draws itself once when the trip opens
    var shown = Math.max(0, Math.min(sg.len, intro * TP.total - TP.cum[i]));
    if (!sg.night) sg.all.style.strokeDasharray = shown + ' ' + (sg.len + 1);
    else sg.all.style.opacity = shown > 0 ? .7 : 0;
  });
  var i = 0; while (i < TP.segs.length - 1 && L > TP.cum[i + 1]) i++;
  var p = TP.segs.length ? TP.segs[i].go.getPointAtLength(Math.max(0, Math.min(TP.segs[i].len, L - TP.cum[i]))) : { x: 0, y: 0 };
  var m = mapScale();
  document.getElementById('tp-here').style.transform = 'translate(' + (m.ox + p.x * m.sc).toFixed(1) + 'px,' + (m.oy + p.y * m.sc).toFixed(1) + 'px)';
}

function stopHTML(s, i) {
  var photos = tripPhotos(i), shown = photos.length, more = shown - 5;
  var cells = photos.slice(0, 6).map(function (it, index) {
    var isMore = index === 5 && shown > 6;
    var star = isBest(i, it.k) && !isMore ? '<span class="star"><span class="ms fill">star</span></span>' : '';
    return '<button class="' + it.c + '" data-action="' + (isMore ? 'openPlacePhotos' : 'viewTrip') + '" data-s="' + i + '" data-k="' + it.k + '" aria-label="' + s.place + (isMore ? ' 사진 ' + shown + '장 전체 보기' : ' 사진 ' + (index + 1) + ' 크게 보기') + '">' + star + (isMore ? '<b class="tp-more"><strong>+' + more + '</strong><small>전체 보기</small></b>' : '') + '</button>';
  }).join('');
  return '<div class="tp-stop" data-i="' + i + '" style="--d:' + DAYT[s.d] + '"><span class="no">' + (i + 1) + '</span>' +
    '<h3><button class="tp-rename" data-action="askPlaceName" data-i="' + i + '" aria-label="장소 이름 바꾸기, 지금 이름 ' + s.place + '"><span>' + s.place + '</span><span class="ms">edit</span></button></h3><div class="when">' + s.when + ' · ' + shown + '장</div><div class="tp-grid">' + cells + '</div></div>';
}
function renderTrip() {
  var S = BUSAN.stops, html = '', removed = App.state.removed.reduce(function (a, b) { return a + b; }, 0);
  BUSAN.days.forEach(function (day, d) {
    var idx = S.map(function (s, i) { return s.d === d ? i : -1; }).filter(function (i) { return i >= 0; });
    html += '<div class="tp-day" style="--d:' + DAYT[d] + '"><b>' + day.label + '</b><span>' + day.date + ' · ' + idx.map(function (i) { return S[i].place.split(' ·')[0]; }).join(' → ') + '</span></div>';
    idx.forEach(function (i) {
      html += stopHTML(S[i], i);
    });
  });
  html += '<div class="tp-end">여행 끝 · ' + S[S.length - 1].place.split(' ·')[0] + ' 오후 3:10</div>';
  document.getElementById('tp-days').innerHTML = html;
  var name = busanTrip().place;
  document.getElementById('tp-title').innerHTML = name;
  document.getElementById('tp-name').firstChild.innerHTML = name;
  document.getElementById('tp-name').setAttribute('aria-label', '여행 이름 바꾸기, 지금 이름 ' + name);
  document.getElementById('tp-meta').textContent = '2026. 5. 3 – 5. 5 · 3일 · ' + (186 - removed) + '장 · 7곳';
}

/* scroll → where 핀 stands: stays at the stop you're reading, walks on as that stop leaves the screen */
function tripProgress() {
  var map = document.getElementById('tp-map').getBoundingClientRect(), line = map.bottom + 60;
  var stops = document.querySelectorAll('#tp-days .tp-stop'), idx = 0, frac = 0;
  for (var i = 0; i < stops.length; i++) {
    var r = stops[i].getBoundingClientRect();
    if (r.top <= line) { idx = i; frac = Math.max(0, Math.min(1, (line - r.top) / r.height)); }
  }
  var walk = Math.max(0, Math.min(1, (frac - .55) / .45)); walk = walk * walk * (3 - 2 * walk);
  var seg = TP.segs[idx];
  return seg ? TP.cum[idx] + seg.len * walk : TP.total;
}
App.loop('trip', function (dt) {
  if (TP.intro < 1) TP.intro = Math.min(1, TP.intro + dt / 1.6);
  TP.Lwant = tripProgress();
  TP.L += (TP.Lwant - TP.L) * Math.min(1, dt * 6);
  drawRoute(TP.L, TP.intro);
});
App.onEnter('trip', function () {
  renderTrip();
  if (!TP.segs.length) buildMap();
  TP.intro = (App.shot || App.reducedMotion || App.state.tripSeen) ? 1 : 0;
  App.state.tripSeen = true;
  TP.L = TP.Lwant = tripProgress();
  drawRoute(TP.L, TP.intro);
});

/* 여행 = 색 방울: the card's dot swells into a circle of the trip colour that fills the screen, the colour lifts
   inside it and the trip shows through; back reverses it into the dot. (Same as the app: TripReveal) */
var REVEAL_MS = 520;
function revealTrip(origin, color, opening, done) {
  var trip = document.getElementById('trip'), list = document.getElementById(App.stack[App.stack.length - (opening ? 2 : 2)] || 'trips');
  var w = trip.offsetWidth, h = trip.offsetHeight, x = origin ? origin[0] : w / 2, y = origin ? origin[1] : h / 2;
  var far = Math.max(Math.hypot(x, y), Math.hypot(w - x, y), Math.hypot(x, h - y), Math.hypot(w - x, h - y));
  ['anim-push-in', 'anim-push-out', 'anim-pop-in', 'anim-pop-out'].forEach(function (c) { trip.classList.remove(c); if (list) list.classList.remove(c); });
  if (list) {   // keep the list visible underneath while the circle grows / shrinks (the shell hides it after 320ms)
    list.hidden = false; list.classList.add('under');
    App.after(330, function () { if (list.classList.contains('under')) list.hidden = false; });
  }
  var tint = document.createElement('div');
  tint.style.cssText = 'position:absolute;inset:0;z-index:50;pointer-events:none;background:' + color;
  trip.appendChild(tint);
  var small = 'circle(11px at ' + x + 'px ' + y + 'px)', big = 'circle(' + far + 'px at ' + x + 'px ' + y + 'px)';
  var ms = App.reducedMotion ? 1 : REVEAL_MS, ease = 'cubic-bezier(.4,0,.2,1)';
  trip.animate([{ clipPath: opening ? small : big }, { clipPath: opening ? big : small }], { duration: ms, easing: ease, fill: 'forwards' });
  tint.animate(opening ? [{ opacity: 1 }, { opacity: 1, offset: .4 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 1, offset: .6 }, { opacity: 1 }], { duration: ms, easing: ease, fill: 'forwards' });
  App.after(ms, function () {
    tint.remove();
    if (list) list.classList.remove('under');
    if (opening) { trip.getAnimations().forEach(function (a) { a.cancel(); }); if (list && !list.classList.contains('active')) list.hidden = true; }
    if (done) done();
  });
}
App.actions.tripBack = function () {
  if (App.shot || !App.state.tripReveal) return;   // plain back (data-back)
  var r = App.state.tripReveal; App.state.tripReveal = null;
  revealTrip(r.origin, r.color, false, function () {
    App.back();
    var trip = document.getElementById('trip');
    ['anim-pop-in', 'anim-pop-out'].forEach(function (c) { document.querySelectorAll('.' + c).forEach(function (e) { e.classList.remove(c); }); });
    trip.getAnimations().forEach(function (a) { a.cancel(); });
  });
  return false;
};

/* only the Busan trip has sample data in the prototype */
App.actions.openTrip = function (el) {
  var k = +el.getAttribute('data-k'), t = analysisData().trips[k];
  if (t && t.key === '부산' && !analysisData().partial) {
    var dot = el.querySelector('.tk-dot'), dev = document.getElementById('trips').getBoundingClientRect(), origin = null;
    if (dot) { var r = dot.getBoundingClientRect(), s = document.getElementById('trips').offsetWidth / dev.width; origin = [(r.left + r.width / 2 - dev.left) * s, (r.top + r.height / 2 - dev.top) * s]; }
    App.go('trip');
    if (!App.shot) { App.state.tripReveal = { origin: origin, color: t.c }; revealTrip(origin, t.c, true); }
    return false;
  }
  App.snack('시안에서는 부산 여행만 열어 볼 수 있어요');
  return false;
};

/* ── rename: Wend names trips and places from the map; the user can always say what it really was ──
   Trip: long-press its card in the list, or tap the title here. Place: tap its name. If other places still carry the
   same name, Wend asks once whether they change too — "same name" is checked against the names as they are now, so a
   place that was renamed on its own is no longer asked about. Renaming never merges or splits places. */
function busanTrip() { return TRIPS_ALL.filter(function (t) { return t.key === '부산'; })[0]; }
function unesc(s) { var t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function fieldError(id, help, msg) {
  document.getElementById(id).closest('.field').classList.toggle('error', !!msg);
  if (msg) document.getElementById(help).textContent = msg;
}
function askTripName(t) {
  App.state.renameTrip = t;
  var input = document.getElementById('tn-name');
  input.value = unesc(t.place);
  document.getElementById('tn-when').textContent = t.date + ' · ' + fmt(t.n) + '장';
  document.getElementById('tn-help').textContent = '처음 이름: ' + unesc(t.key || t.place);
  fieldError('tn-name', 'tn-help', '');
  App.dialog('trip-name');
  App.after(80, function () { input.focus(); input.select(); });
}
App.actions.askTripName = function () { askTripName(busanTrip()); };
App.actions.saveTripName = function () {
  var v = document.getElementById('tn-name').value.trim(), t = App.state.renameTrip;
  if (!v) { fieldError('tn-name', 'tn-help', '이름을 입력해 주세요'); return false; }
  App.close();
  var before = t.place;
  if (esc(v) === before) return;
  t.place = esc(v);
  showTripRename(t);
  App.snack('여행 이름을 바꿨어요', '되돌리기', function () { t.place = before; showTripRename(t); });
};
function showTripRename(t) {
  if (App.current() === 'trip') {
    renderTrip();
    var b = document.getElementById('tp-name'); b.classList.remove('renamed'); void b.offsetWidth; b.classList.add('renamed');
  } else if (App.current() === 'trips') {
    var k = TR.data.trips.indexOf(t);
    renderTrips();
    var card = document.querySelector('#tr-list .tc[data-k="' + k + '"]');
    if (card) card.classList.add('renamed');
  }
}

function placeWhen(i) { var s = BUSAN.stops[i]; return BUSAN.days[s.d].label + ' · ' + s.when.split(' –')[0]; }
App.actions.askPlaceName = function (el) {
  var i = +el.getAttribute('data-i'), s = BUSAN.stops[i], input = document.getElementById('pn-name');
  App.state.renamePlace = i;
  input.value = unesc(s.place);
  document.getElementById('pn-when').textContent = placeWhen(i) + ' · ' + (s.n - App.state.removed[i]) + '장';
  document.getElementById('pn-help').textContent = '처음 이름: ' + s.auto;
  fieldError('pn-name', 'pn-help', '');
  App.dialog('place-name');
  App.after(80, function () { input.focus(); input.select(); });
};
App.actions.savePlaceName = function () {
  var v = document.getElementById('pn-name').value.trim(), i = App.state.renamePlace, old = BUSAN.stops[i].place;
  if (!v) { fieldError('pn-name', 'pn-help', '이름을 입력해 주세요'); return false; }
  App.close();
  if (esc(v) === old) return;
  App.state.renameTo = esc(v);
  // same name right now, anywhere else in the trip
  var others = BUSAN.stops.map(function (s, j) { return j !== i && s.place === old ? j : -1; }).filter(function (j) { return j >= 0; });
  App.state.renameOthers = others;
  if (!others.length) { renamePlaces([i]); return; }
  document.getElementById('ps-title').textContent = '같은 이름이 ' + others.length + '곳 더 있어요';
  document.getElementById('ps-text').textContent = '‘' + unesc(old) + '’ — ' + others.map(placeWhen).join(', ') + '에 들른 곳도 같이 바꿀까요?';
  App.after(200, function () { App.dialog('place-same'); });
};
App.actions.renameOne = function () { renamePlaces([App.state.renamePlace]); };
App.actions.renameAll = function () { renamePlaces([App.state.renamePlace].concat(App.state.renameOthers)); };
function renamePlaces(idx) {
  var before = idx.map(function (j) { return BUSAN.stops[j].place; });
  idx.forEach(function (j) { BUSAN.stops[j].place = App.state.renameTo; });
  glowPlaces(idx);
  App.snack(idx.length > 1 ? '장소 ' + idx.length + '곳의 이름을 바꿨어요' : '장소 이름을 바꿨어요', '되돌리기', function () {
    idx.forEach(function (j, n) { BUSAN.stops[j].place = before[n]; });
    glowPlaces(idx);
  });
}
/* every place that changed glows together — on the list and on the map — so it's visible what moved with it */
function glowPlaces(idx) {
  renderTrip();
  idx.forEach(function (j) {
    var b = document.querySelector('#tp-days .tp-stop[data-i="' + j + '"] .tp-rename');
    if (b) b.classList.add('renamed');
    var n = document.querySelector('#tp-nums span[data-i="' + j + '"]');
    if (n) { n.classList.remove('renamed'); void n.offsetWidth; n.classList.add('renamed'); }
  });
}

/* ── best shots: Wend only groups photos shot again and again (same scene); the user picks one per scene, or none ── */
function bsPhoto(s, k) { return tripPhotos(s).filter(function (it) { return it.k === k; })[0]; }
function renderBest() {
  // 크게 보기에서 돌아올 때는 고르던 것을 그대로 둔다
  var d = App.state.keepPick ? App.state.bestDraft : (App.state.bestDraft = {});
  if (!App.state.keepPick) for (var key in App.state.best) d[key] = App.state.best[key];
  App.state.keepPick = false;
  document.getElementById('bs-list').innerHTML = BUSAN.stops.map(function (s, i) {
    var rows = (s.sc || []).map(function (ks, j) {
      var items = ks.map(function (k) { return bsPhoto(i, k); }).filter(Boolean);
      if (items.length < 2) return '';
      return '<div class="bs-scene"><p>' + items[0].t + ' · 비슷한 사진 ' + items.length + '장</p><div class="bs-row">' +
        items.map(function (it, n) {
          var on = !!d[i + ':' + j] && d[i + ':' + j].k === it.k, name = s.place + ' ' + items[0].t + ' 비슷한 사진 ' + (n + 1);
          return '<div class="bs-tile' + (on ? ' on' : '') + '" data-k="' + it.k + '"><button class="pick ' + it.c + '" data-action="pickBest" data-key="' + i + ':' + j + '" data-s="' + i + '" data-k="' + it.k + '" aria-pressed="' + on + '" aria-label="' + name + '">' +
            '<span class="star"><span class="ms fill">star</span></span></button>' +
            '<button class="zoom" data-action="viewBest" data-key="' + i + ':' + j + '" data-k="' + it.k + '" aria-label="' + name + ' 크게 보기"><span class="ms">open_in_full</span></button></div>';
        }).join('') + '</div></div>';
    }).join('');
    return rows ? '<div class="bs-grp"><h3>' + (i + 1) + '. ' + s.place + '</h3>' + rows + '</div>' : '';
  }).join('');
  /* no scene shot more than once (e.g. every photo was cleaned up): nothing to pick — say so, no button */
  var empty = !document.querySelector('#bs-list .bs-row');
  document.querySelector('#best .bs-intro').textContent = empty ? '이 여행에는 같은 장면을 여러 번 찍은 사진이 없어요.' :
    '같은 장면을 여러 번 찍은 사진끼리 모았어요. 장면마다 마음에 드는 한 장을 골라 주세요. 안 골라도 돼요. 고른 사진은 여행의 대표 사진이 돼요.';
  document.getElementById('bs-done').parentNode.hidden = empty;
  bestCount();
}
function bestCount() {
  var n = Object.keys(App.state.bestDraft).length, b = document.getElementById('bs-done');
  b.disabled = !n;
  b.textContent = n ? n + '장으로 정하기' : '사진을 골라 주세요';
}
App.onEnter('best', renderBest);
/* tap picks one in that scene; tapping the picked one again clears it (a scene may stay without a best shot) */
App.actions.pickBest = function (el) {
  var key = el.getAttribute('data-key'), s = +el.getAttribute('data-s'), k = +el.getAttribute('data-k'), d = App.state.bestDraft;
  togglePick(key, s, k);
  el.closest('.bs-row').querySelectorAll('.bs-tile').forEach(function (t) {
    var on = !!d[key] && d[key].k === +t.getAttribute('data-k');
    t.classList.toggle('on', on); t.querySelector('.pick').setAttribute('aria-pressed', on);
  });
  bestCount();
};
/* 장면마다 한 장 — 고른 사진을 다시 고르면 그 장면은 고르지 않은 채로(목록과 크게 보기가 같이 쓴다) */
function togglePick(key, s, k) {
  var d = App.state.bestDraft;
  if (d[key] && d[key].k === k) delete d[key]; else d[key] = { s: s, k: k };
}
App.actions.viewBest = function (el) { App.state.keepPick = true; openViewer('best', el.getAttribute('data-key'), +el.getAttribute('data-k')); return false; };
App.actions.bestDone = function () {
  App.state.best = App.state.bestDraft;
  var n = Object.keys(App.state.best).length;
  App.state.bestDone = true;
  App.back();
  App.after(320, function () { App.snack('베스트샷 ' + n + '장을 골랐어요. 사진에 별이 붙어 있어요'); });
};

/* ── clean up: suggested photos, all pre-checked; Android's own dialog confirms the move to trash ── */
var CLEAN = [
  { t: '흔들린 사진', cls: 'blur', items: [[1, 'p-sky'], [1, 'p-city'], [3, 'p-sea'], [3, 'p-sea'], [5, 'p-dusk'], [5, 'p-city'], [4, 'p-sea'], [1, 'p-cafe'], [2, 'p-food']] },
  { t: '비슷한 사진', sub: '베스트샷과 거의 같은 사진', cls: '', items: [[1, 'p-sky'], [1, 'p-sky'], [1, 'p-city'], [3, 'p-sea'], [3, 'p-sea'], [5, 'p-dusk'], [5, 'p-dusk'], [5, 'p-dusk'], [4, 'p-sea'], [6, 'p-sea'], [4, 'p-sky']] },
  { t: '너무 어두운 사진', cls: 'dark', items: [[5, 'p-city'], [5, 'p-dusk'], [2, 'p-food']] },
];
App.state.cleanSel = null;
function renderClean() {
  if (!App.state.cleanSel) App.state.cleanSel = CLEAN.map(function (c) { return c.items.map(function () { return true; }); });
  document.getElementById('cl-list').innerHTML = CLEAN.map(function (c, ci) {
    return '<div class="cl-cat"><b>' + c.t + '</b><span>' + (c.sub ? c.sub + ' · ' : '') + c.items.length + '장</span></div><div class="cl-grid">' +
      c.items.map(function (it, k) {
        var name = c.t + ' ' + (k + 1) + ', ' + BUSAN.stops[it[0]].place;
        return '<div class="cl-tile' + (App.state.cleanSel[ci][k] ? ' on' : '') + '"><button class="pick ' + c.cls + '" data-action="toggleClean" data-c="' + ci + '" data-k="' + k + '" aria-pressed="' + !!App.state.cleanSel[ci][k] + '" aria-label="' + name + '">' +
          '<i class="' + it[1] + '"></i><span class="ck"><span class="ms">check</span></span></button>' +
          '<button class="zoom" data-action="viewClean" data-c="' + ci + '" data-k="' + k + '" aria-label="' + name + ' 크게 보기"><span class="ms">open_in_full</span></button></div>';
      }).join('') + '</div>';
  }).join('');
  cleanCount();
}
function cleanCount() {
  var n = 0; App.state.cleanSel.forEach(function (row) { row.forEach(function (v) { if (v) n++; }); });
  var b = document.getElementById('cl-go');
  b.textContent = n ? n + '장 휴지통으로 옮기기' : '옮길 사진을 골라 주세요';
  b.disabled = !n;
  return n;
}
App.onEnter('clean', function () {
  // 크게 보기에서 돌아올 때는 체크를 그대로 둔다
  if (!App.state.keepPick) App.state.cleanSel = null;
  App.state.keepPick = false;
  renderClean();
});
App.actions.toggleClean = function (el) {
  var c = +el.getAttribute('data-c'), k = +el.getAttribute('data-k');
  App.state.cleanSel[c][k] = !App.state.cleanSel[c][k];
  el.parentNode.classList.toggle('on', App.state.cleanSel[c][k]);
  el.setAttribute('aria-pressed', App.state.cleanSel[c][k]);
  cleanCount();
};
App.actions.viewClean = function (el) { App.state.keepPick = true; openViewer('clean', +el.getAttribute('data-c'), +el.getAttribute('data-k')); return false; };
App.actions.trashAsk = function () { document.getElementById('tr-n').textContent = cleanCount() + '개'; };
App.actions.trashOk = function () {
  var n = 0;
  CLEAN.forEach(function (c, ci) { c.items.forEach(function (it, k) { if (App.state.cleanSel[ci][k]) { App.state.removed[it[0]]++; n++; } }); });
  TRIPS_ALL.forEach(function (t) { if (t.key === '부산') t.n -= n; });
  TOTAL_ALL -= n;
  App.after(320, function () { App.snack(n + '장을 휴지통으로 옮겼어요. 30일 안에 갤러리에서 되살릴 수 있어요'); });
};
</script>
