<script id="trip-js">
/* ═══ Flow 5 · 여행 상세 ═══════════════════════════════════════════════
   Signature: the trip read in the order it happened. Sections follow time (day → place), the paper map above keeps the
   whole route in faint day colours, and as you scroll 핀 walks the route to the place you're reading — the walked part
   turns solid. Scrolling the trip = moving through it. */
var DAYC = ['#e2553a', '#2f7fd8', '#2bae8e'], DAYT = ['#b8391f', '#1f63b3', '#1d7a62'];   // map colours · text-safe shades
var BUSAN = {
  days: [
    { label: '1일째', date: '5월 3일 일요일' },
    { label: '2일째', date: '5월 4일 월요일' },
    { label: '3일째', date: '5월 5일 화요일 · 어린이날' },
  ],
  stops: [   // x,y on the map (lon/lat projected); ph = stand-in photos, first five = one "similar" group
    { d: 0, place: '부산역', when: '오전 11:20', n: 6, x: 97, y: 119, ph: ['p-city', 'p-cafe', 'p-city', 'p-sky', 'p-cafe', 'p-food'] },
    { d: 0, place: '감천문화마을', when: '오후 1:40 – 3:30', n: 38, x: 51, y: 151, ph: ['p-sky', 'p-city', 'p-sky', 'p-cafe', 'p-dusk', 'p-food'] },
    { d: 0, place: '남포동 · 자갈치시장', when: '오후 5:10 – 7:00', n: 21, x: 85, y: 150, ph: ['p-food', 'p-food', 'p-city', 'p-dusk', 'p-food', 'p-cafe'] },
    { d: 1, place: '해운대', when: '오전 9:50 – 12:10', n: 34, x: 283, y: 40, ph: ['p-sea', 'p-sea', 'p-sky', 'p-sea', 'p-food', 'p-cafe'] },
    { d: 1, place: '청사포', when: '오후 2:00 – 4:20', n: 29, x: 332, y: 36, ph: ['p-sea', 'p-sky', 'p-sea', 'p-forest', 'p-cafe', 'p-sea'] },
    { d: 1, place: '광안리', when: '오후 7:30 – 9:40', n: 31, x: 218, y: 51, ph: ['p-dusk', 'p-city', 'p-dusk', 'p-dusk', 'p-food', 'p-city'] },
    { d: 2, place: '흰여울문화마을', when: '오전 10:30 – 12:00', n: 19, x: 107, y: 186, ph: ['p-sea', 'p-sky', 'p-sea', 'p-cafe', 'p-sky', 'p-sea'] },
    { d: 2, place: '부산역', when: '오후 3:10', n: 8, x: 97, y: 119, ph: ['p-city', 'p-food', 'p-cafe', 'p-city', 'p-sky', 'p-cafe'] },
  ],
};
App.state.best = BUSAN.stops.map(function () { return 0; });   // index of the chosen best shot per stop (0 = 추천)
App.state.bestDone = false;
App.state.removed = BUSAN.stops.map(function () { return 0; });

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
var TP = { segs: [], cum: [0], total: 0, L: 0, Lwant: 0, intro: 1 };

/* map: one curved segment per move; overnight moves (day changes) drawn as a dotted line */
function buildMap() {
  var routes = document.getElementById('tp-routes'), stopsG = document.getElementById('tp-stops'), S = BUSAN.stops;
  routes.innerHTML = ''; stopsG.innerHTML = ''; TP.segs = []; TP.cum = [0];
  for (var i = 0; i < S.length - 1; i++) {
    var a = S[i], b = S[i + 1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
    var bend = a.x === b.x && a.y === b.y ? 0 : .18, cx = mx - dy * bend, cy = my + dx * bend;
    var d = 'M' + a.x + ' ' + a.y + 'Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b.x + ' ' + b.y;
    var night = a.d !== b.d, col = DAYC[b.d];
    var all = svgEl('path', { d: d, class: night ? 'r-night' : 'r-all', stroke: night ? '' : col });
    var go = svgEl('path', { d: d, class: 'r-go', stroke: night ? '#8a7d70' : col });
    if (night) go.setAttribute('stroke-dasharray', '2 5');
    routes.appendChild(all); routes.appendChild(go);
    var len = go.getTotalLength();
    TP.segs.push({ go: go, all: all, len: len, night: night });
    TP.cum.push(TP.cum[i] + len);
  }
  TP.total = TP.cum[TP.cum.length - 1];
  placeStopNumbers();
}
/* stop numbers sit on the map as HTML (crisp at any scale); positions follow the SVG's "slice" scaling */
function mapScale() {
  var w = document.getElementById('tp-map').offsetWidth || 412, sc = Math.max(w / 380, 1);
  return { sc: sc, ox: (w - 380 * sc) / 2, oy: (220 - 220 * sc) / 2 };
}
function placeStopNumbers() {
  var box = document.getElementById('tp-nums'), m = mapScale(), sc = m.sc, ox = m.ox, oy = m.oy;
  box.innerHTML = BUSAN.stops.map(function (s, i) {
    if (i === BUSAN.stops.length - 1 && s.x === BUSAN.stops[0].x && s.y === BUSAN.stops[0].y) return '';   // back at the station: one dot is enough
    return '<span style="background:' + DAYT[s.d] + ';left:' + (ox + s.x * sc).toFixed(1) + 'px;top:' + (oy + s.y * sc).toFixed(1) + 'px">' + (i + 1) + '</span>';
  }).join('');
}
function drawRoute(L, intro) {
  TP.segs.forEach(function (sg, i) {
    var drawn = Math.max(0, Math.min(sg.len, L - TP.cum[i]));
    if (!sg.night) sg.go.style.strokeDasharray = drawn + ' ' + (sg.len + 1);
    else sg.go.style.opacity = drawn > 0 ? 1 : 0;
    // intro: the faint full route draws itself once when the trip opens
    var shown = Math.max(0, Math.min(sg.len, intro * TP.total - TP.cum[i]));
    if (!sg.night) sg.all.style.strokeDasharray = shown + ' ' + (sg.len + 1);
    else sg.all.style.opacity = shown > 0 ? .7 : 0;
  });
  var i = 0; while (i < TP.segs.length - 1 && L > TP.cum[i + 1]) i++;
  var p = TP.segs.length ? TP.segs[i].go.getPointAtLength(Math.max(0, Math.min(TP.segs[i].len, L - TP.cum[i]))) : { x: 0, y: 0 };
  var m = mapScale();
  document.getElementById('tp-here').style.transform = 'translate(' + (m.ox + p.x * m.sc).toFixed(1) + 'px,' + (m.oy + p.y * m.sc).toFixed(1) + 'px)';
}

function stopHTML(s, i) {
  var shown = s.n - App.state.removed[i], more = shown - 6, best = App.state.best[i];
  var cells = s.ph.map(function (c, k) {
    var star = App.state.bestDone && k === best ? '<span class="star"><span class="ms fill">star</span></span>' : '';
    return '<button class="' + c + '" data-action="viewTrip" data-s="' + i + '" data-k="' + k + '" aria-label="' + s.place + ' 사진 ' + (k + 1) + ' 크게 보기">' + star + (k === 5 && more > 0 ? '<b>+' + more + '</b>' : '') + '</button>';
  }).join('');
  return '<div class="tp-stop" data-i="' + i + '" style="--d:' + DAYT[s.d] + '"><span class="no">' + (i + 1) + '</span>' +
    '<h3>' + s.place + '</h3><div class="when">' + s.when + ' · ' + shown + '장</div><div class="tp-grid">' + cells + '</div></div>';
}
function renderTrip() {
  var S = BUSAN.stops, html = '', removed = App.state.removed.reduce(function (a, b) { return a + b; }, 0);
  BUSAN.days.forEach(function (day, d) {
    var idx = S.map(function (s, i) { return s.d === d ? i : -1; }).filter(function (i) { return i >= 0; });
    html += '<div class="tp-day" style="--d:' + DAYT[d] + '"><b>' + day.label + '</b><span>' + day.date + ' · ' + idx.map(function (i) { return S[i].place.split(' ·')[0]; }).join(' → ') + '</span></div>';
    idx.forEach(function (i) {
      html += stopHTML(S[i], i);
    });
  });
  html += '<div class="tp-end">여행 끝 · 부산역 오후 3:10</div>';
  document.getElementById('tp-days').innerHTML = html;
  document.getElementById('tp-meta').textContent = '2026. 5. 3 – 5. 5 · 3일 · ' + (186 - removed) + '장 · 7곳';
}

/* scroll → where 핀 stands: stays at the stop you're reading, walks on as that stop leaves the screen */
function tripProgress() {
  var map = document.getElementById('tp-map').getBoundingClientRect(), line = map.bottom + 60;
  var stops = document.querySelectorAll('#tp-days .tp-stop'), idx = 0, frac = 0;
  for (var i = 0; i < stops.length; i++) {
    var r = stops[i].getBoundingClientRect();
    if (r.top <= line) { idx = i; frac = Math.max(0, Math.min(1, (line - r.top) / r.height)); }
  }
  var walk = Math.max(0, Math.min(1, (frac - .55) / .45)); walk = walk * walk * (3 - 2 * walk);
  var seg = TP.segs[idx];
  return seg ? TP.cum[idx] + seg.len * walk : TP.total;
}
App.loop('trip', function (dt) {
  if (TP.intro < 1) TP.intro = Math.min(1, TP.intro + dt / 1.6);
  TP.Lwant = tripProgress();
  TP.L += (TP.Lwant - TP.L) * Math.min(1, dt * 6);
  drawRoute(TP.L, TP.intro);
});
App.onEnter('trip', function () {
  renderTrip();
  if (!TP.segs.length) buildMap();
  TP.intro = (App.shot || App.reducedMotion || App.state.tripSeen) ? 1 : 0;
  App.state.tripSeen = true;
  TP.L = TP.Lwant = tripProgress();
  drawRoute(TP.L, TP.intro);
});

/* only the Busan trip has sample data in the prototype */
App.actions.openTrip = function (el) {
  var k = +el.getAttribute('data-k'), t = analysisData().trips[k];
  if (t && t.place === '부산' && !analysisData().partial) { App.go('trip'); return false; }
  App.snack('시안에서는 부산 여행만 열어 볼 수 있어요');
  return false;
};

/* ── best shots: one row of similar photos per stop, the recommended one pre-picked ── */
function renderBest() {
  document.getElementById('bs-list').innerHTML = BUSAN.stops.map(function (s, i) {
    return '<div class="bs-grp"><h3>' + (i + 1) + '. ' + s.place + '<span>비슷한 사진 5장</span></h3><div class="bs-row">' +
      s.ph.slice(0, 5).map(function (c, k) {
        return '<button class="' + c + (App.state.best[i] === k ? ' on' : '') + '" data-action="pickBest" data-i="' + i + '" data-k="' + k + '" aria-label="' + s.place + ' 사진 ' + (k + 1) + (k === 0 ? ', 추천' : '') + '">' +
          (k === 0 ? '<span class="rec">추천</span>' : '') + '<span class="star"><span class="ms fill">star</span></span></button>';
      }).join('') + '</div></div>';
  }).join('');
}
App.onEnter('best', renderBest);
App.actions.pickBest = function (el) {
  var i = +el.getAttribute('data-i'), k = +el.getAttribute('data-k');
  App.state.best[i] = k;
  el.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === el); });
};
App.actions.bestDone = function () {
  App.state.bestDone = true;
  App.back();
  App.after(320, function () { App.snack('베스트샷 8장을 골랐어요. 사진에 별이 붙어 있어요'); });
};

/* ── clean up: suggested photos, all pre-checked; Android's own dialog confirms the move to trash ── */
var CLEAN = [
  { t: '흔들린 사진', cls: 'blur', items: [[1, 'p-sky'], [1, 'p-city'], [3, 'p-sea'], [3, 'p-sea'], [5, 'p-dusk'], [5, 'p-city'], [4, 'p-sea'], [1, 'p-cafe'], [2, 'p-food']] },
  { t: '비슷한 사진', sub: '베스트샷과 거의 같은 사진', cls: '', items: [[1, 'p-sky'], [1, 'p-sky'], [1, 'p-city'], [3, 'p-sea'], [3, 'p-sea'], [5, 'p-dusk'], [5, 'p-dusk'], [5, 'p-dusk'], [4, 'p-sea'], [6, 'p-sea'], [4, 'p-sky']] },
  { t: '너무 어두운 사진', cls: 'dark', items: [[5, 'p-city'], [5, 'p-dusk'], [2, 'p-food']] },
];
App.state.cleanSel = null;
function renderClean() {
  if (!App.state.cleanSel) App.state.cleanSel = CLEAN.map(function (c) { return c.items.map(function () { return true; }); });
  document.getElementById('cl-list').innerHTML = CLEAN.map(function (c, ci) {
    return '<div class="cl-cat"><b>' + c.t + '</b><span>' + (c.sub ? c.sub + ' · ' : '') + c.items.length + '장</span></div><div class="cl-grid">' +
      c.items.map(function (it, k) {
        return '<button class="' + c.cls + (App.state.cleanSel[ci][k] ? ' on' : '') + '" data-action="toggleClean" data-c="' + ci + '" data-k="' + k + '" aria-label="' + c.t + ' ' + (k + 1) + ', ' + BUSAN.stops[it[0]].place + '">' +
          '<i class="' + it[1] + '"></i><span class="ck"><span class="ms">check</span></span></button>';
      }).join('') + '</div>';
  }).join('');
  cleanCount();
}
function cleanCount() {
  var n = 0; App.state.cleanSel.forEach(function (row) { row.forEach(function (v) { if (v) n++; }); });
  var b = document.getElementById('cl-go');
  b.textContent = n ? n + '장 휴지통으로 옮기기' : '옮길 사진을 골라 주세요';
  b.disabled = !n;
  return n;
}
App.onEnter('clean', function () { App.state.cleanSel = null; renderClean(); });
App.actions.toggleClean = function (el) {
  var c = +el.getAttribute('data-c'), k = +el.getAttribute('data-k');
  App.state.cleanSel[c][k] = !App.state.cleanSel[c][k];
  el.classList.toggle('on', App.state.cleanSel[c][k]);
  cleanCount();
};
App.actions.trashAsk = function () { document.getElementById('tr-n').textContent = cleanCount() + '개'; };
App.actions.trashOk = function () {
  var n = 0;
  CLEAN.forEach(function (c, ci) { c.items.forEach(function (it, k) { if (App.state.cleanSel[ci][k]) { App.state.removed[it[0]]++; n++; } }); });
  TRIPS_ALL.forEach(function (t) { if (t.place === '부산') t.n -= n; });
  TOTAL_ALL -= n;
  App.after(320, function () { App.snack(n + '장을 휴지통으로 옮겼어요. 30일 안에 갤러리에서 되살릴 수 있어요'); });
};
</script>
