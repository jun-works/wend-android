<script id="viewer-js">
/* ═══ Common · 사진 크게 보기 ═══════════════════════════════════════════
   One viewer for every photo grid. It pages through the set it was opened from (swipe sideways); the header shows
   when and where; only the bottom actions change with the place it was opened from:
   trip → 베스트샷 · 여행에서 빼기 · 공유 · 휴지통      left → 여행에 넣기 · 새 여행 · 공유 · 휴지통 */
var TRIP_DATES = ['2026-05-03', '2026-05-04', '2026-05-05'];
function addMin(t, m) {   // '오후 1:40' + 7 → '오후 1:47'
  var am = t.indexOf('오전') === 0, hm = t.split(' ')[1].split(':'), h = +hm[0] % 12 + (am ? 0 : 12), min = h * 60 + +hm[1] + m;
  h = Math.floor(min / 60) % 24; var mm = min % 60;
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm;
}
function longDate(d) { var p = d.split('-'); return +p[0] + '년 ' + +p[1] + '월 ' + +p[2] + '일'; }

/* open from a trip stop (s = stop, k = photo) or from the left-out list (id) */
function openViewer(ctx, a, b) {
  var items, i = 0;
  if (ctx === 'trip') {
    items = tripPhotos(a);
    i = Math.max(0, items.findIndex(function (it) { return it.k === b; }));
  } else {
    items = []; LEFT.forEach(function (g) { g.items.forEach(function (it) { items.push({ c: it.c, d: it.d, t: it.t, place: it.place, id: it.id }); }); });
    items.forEach(function (it, n) { if (it.id === a) i = n; });
  }
  if (!items.length) return;
  App.state.vw = { ctx: ctx, items: items, i: i };
  App.go('viewer');
}
App.actions.viewTrip = function (el) { openViewer('trip', +el.getAttribute('data-s'), +el.getAttribute('data-k')); return false; };

function vwCur() { var v = App.state.vw; return v.items[v.i]; }
function vwHeader() {
  var v = App.state.vw, it = vwCur();
  v.id = it.id;
  document.getElementById('vw-title').innerHTML = longDate(it.d) + ' ' + it.t +
    (it.place ? '<span id="vw-place" style="--c:' + (it.col || '#8a7d70') + '"><i></i>' + it.place + '</span>' : '');
  document.getElementById('vw-count').textContent = (v.i + 1) + ' / ' + v.items.length;
  vwActions();
}
function act(icon, label, action, extra) {
  return '<button class="vw-act' + (extra || '') + '" data-action="' + action + '"><span class="ms' + (extra === ' on' ? ' fill' : '') + '">' + icon + '</span>' + label + '</button>';
}
function vwActions() {
  var v = App.state.vw, it = vwCur(), html;
  if (v.ctx === 'trip') {
    var best = isBest(it.s, it.k);
    html = act('star', best ? '베스트샷' : '베스트샷으로', 'vwBest', best ? ' on' : '') + act('remove_circle_outline', '여행에서 빼기', 'vwOut') +
      act('share', '공유', 'vwShare') + act('delete', '휴지통', 'vwTrash', ' warn');
  } else {
    html = act('library_add', '여행에 넣기', 'vwAdd') + act('add_location_alt', '새 여행', 'vwNew') + act('share', '공유', 'vwShare') + act('delete', '휴지통', 'vwTrash', ' warn');
  }
  document.getElementById('vw-acts').innerHTML = html;
}
function vwSlides() {
  var v = App.state.vw;
  document.getElementById('vw-track').innerHTML = v.items.map(function (it) {
    var star = v.ctx === 'trip' && isBest(it.s, it.k) ? '<span class="star"><span class="ms fill">star</span>베스트샷</span>' : '';
    return '<div class="vw-slide"><i class="' + it.c + '">' + star + '</i></div>';
  }).join('');
}
App.onEnter('viewer', function () {
  if (!App.state.vw) openViewerState();
  vwSlides(); vwHeader();
  var tr = document.getElementById('vw-track');
  tr.scrollLeft = App.state.vw.i * tr.clientWidth;
});
function openViewerState() { App.state.vw = { ctx: 'trip', i: 0, items: tripPhotos(1) }; }
document.getElementById('vw-track').addEventListener('scroll', function () {
  var v = App.state.vw; if (!v || App.current() !== 'viewer' || !this.clientWidth) return;
  var i = Math.round(this.scrollLeft / this.clientWidth);
  if (i !== v.i && v.items[i]) { v.i = i; vwHeader(); }
}, { passive: true });

/* ── trip actions ── */
App.actions.vwBest = function () {
  var it = vwCur();
  if (isBest(it.s, it.k)) return;   // already the best shot of its scene — nothing to change
  App.state.best[bestKey(it.s, it.k)] = { s: it.s, k: it.k }; App.state.bestDone = true;
  vwSlides(); vwActions();
  var tr = document.getElementById('vw-track'); tr.scrollLeft = App.state.vw.i * tr.clientWidth;
  App.snack('이 사진을 ' + it.place + '의 베스트샷으로 골랐어요');
};
App.actions.vwOut = function () {
  var it = vwCur(), v = App.state.vw;
  if (v.leaving) return false;
  /* the photo turns into a drop of its day colour and falls away — leaving the trip, back to the loose photos */
  var slide = document.querySelectorAll('#vw-track .vw-slide i')[v.i];
  v.leaving = true;
  document.getElementById('viewer').classList.add('leaving');
  if (slide) { slide.style.setProperty('--d', it.col || '#e2553a'); slide.classList.add('out'); }
  App.after(App.reducedMotion ? 0 : 820, function () { v.leaving = false; document.getElementById('viewer').classList.remove('leaving'); vwOutDone(it); });
  return false;
};
function vwOutDone(it) {
  forgetTripPhoto(it);
  TRIPS_ALL.forEach(function (t) { if (t.key === '부산') t.n--; });
  leftAdd({ id: 'out-' + it.s + '-' + it.k + '-' + Date.now(), d: it.d, c: it.c, t: it.t, place: it.place });
  App.back();
  App.after(320, function () { App.snack('여행에서 뺐어요. 빠진 사진에서 다시 넣을 수 있어요'); });
}
App.actions.vwShare = function () { App.snack('Android 공유 시트가 열려요'); };
App.actions.vwTrash = function () {
  App.state.trashCtx = 'viewer';
  document.getElementById('tr-n').textContent = '1개';
  App.dialog('sys-trash');
};
/* ── left-out actions: same sheet / dialog as the list, for this one photo ── */
App.actions.vwAdd = function () { App.state.pickFrom = 'viewer'; App.actions.askAdd(); App.sheet('add-sheet'); };
App.actions.vwNew = function () { App.state.pickFrom = 'viewer'; App.actions.askNew(); App.dialog('new-trip'); };

/* the trash dialog serves the clean-up screen and the viewer */
var _trashOk = App.actions.trashOk;
App.actions.trashOk = function (el) {
  if (App.state.trashCtx !== 'viewer') { App.state.trashCtx = null; return _trashOk(el); }
  App.state.trashCtx = null;
  var it = vwCur();
  TOTAL_ALL--;
  if (App.state.vw.ctx === 'trip') { forgetTripPhoto(it); TRIPS_ALL.forEach(function (t) { if (t.key === '부산') t.n--; }); }
  else leftRemove([it.id]);
  App.after(320, function () { App.snack('1장을 휴지통으로 옮겼어요. 30일 안에 갤러리에서 되살릴 수 있어요'); });
};
</script>
