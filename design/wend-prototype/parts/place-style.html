<style id="place-style">
/* A stop on Wend's time rail unfolds into a paper contact sheet. */
#place-photos{--day-ink:#b8391f}
#place-photos .top-app-bar{border-bottom:1px solid var(--outline-variant)}
#place-photos .top-app-bar .title{font:600 17px/1.4 var(--font-body)}
.pg-trip{max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--body-s);color:var(--on-surface-variant);margin-right:8px}
#place-photos .content{padding:0 0 24px;overscroll-behavior:contain}
.pg-heading{padding:24px 20px 0}
.pg-route{display:flex;align-items:center;gap:8px;color:var(--day-ink);font:600 12px/1.5 var(--font-body)}
.pg-stop{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;color:white;background:var(--day-ink);font:600 12px/1 var(--font-body)}
.pg-heading h2{margin:12px 0 6px;font:700 28px/1.4 var(--font-display);overflow-wrap:anywhere}
.pg-heading p{margin:0;color:var(--on-surface-variant);font:var(--body-m)}
.pg-caption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:28px;padding:0 0 12px;border-bottom:1px solid var(--outline-variant)}
.pg-caption b{font:600 14px/1.5 var(--font-body)}
.pg-caption>span{font:var(--body-s);color:var(--on-surface-variant)}
.pg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:12px 16px 0}
.pg-photo{position:relative;display:block;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:5px;cursor:pointer;overflow:hidden}
.pg-photo:focus-visible{outline:3px solid var(--primary);outline-offset:1px;z-index:1}
.pg-photo:active{filter:brightness(.9)}
.pg-photo .pg-star{position:absolute;left:6px;top:6px;width:24px;height:24px;display:grid;place-items:center;background:var(--surface-container-lowest);color:#7a4f05;border-radius:50%}
.pg-star .ms{--ms-size:16px}
.pg-end{text-align:center;padding:20px 16px 0;margin:0;font:var(--body-s);color:var(--on-surface-variant)}
.tp-grid .tp-more{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:rgba(31,26,22,.65)}
.tp-more strong{font:600 20px/1 var(--font-body)}
.tp-more small{font:500 11px/1.4 var(--font-body)}
.photo-flight{position:absolute;z-index:25;pointer-events:none;transform-origin:top left}
.device.photo-moving>.screens{pointer-events:none}
.screen.pg-under,.screen.pg-under[hidden]{display:flex!important;visibility:visible;pointer-events:none}
@media(prefers-reduced-motion:reduce){#place-photos *,#viewer *{animation-duration:0s!important;transition-duration:0s!important}}
</style>
