<script id="analyze-js">
/* ═══ Flow 3 · 분석 중 ═══════════════════════════════════════════════
   Signature: the ink album globe sorts itself. A sun-coloured sweep reads the time (틱), dots take colour (핀),
   then one cluster after another pulls together and merges — and the moment a cluster becomes solid, that trip
   drops out of the globe as a ticket. Only results are shown, never how they were decided. */
var TRIPS_ALL = [   // found oldest → newest (Wend reads in shooting order); the list shows newest on top
  { key: '전주', place: '전주', date: '2025. 4. 5', days: '당일', n: 58, c: '#f2b33d' },
  { key: '오사카', place: '오사카', date: '2025. 6. 7 – 6. 10', days: '4일', n: 231, c: '#2f7fd8' },
  { key: '성수동', place: '성수동', date: '2025. 9. 13', days: '당일', n: 73, c: '#e2553a' },
  { key: '강릉', place: '강릉', date: '2025. 12. 30 – 2026. 1. 1', days: '3일', n: 97, c: '#2bae8e' },
  { key: '도쿄', place: '도쿄', date: '2026. 3. 19 – 3. 22', days: '4일', n: 264, c: '#f2b33d' },
  { key: '부산', place: '부산', date: '2026. 5. 3 – 5. 5', days: '3일', n: 186, c: '#e2553a' },
  { key: '제주', place: '제주', date: '2026. 7. 12 – 7. 23', days: '12일', n: 412, c: '#2f7fd8' },
];
var TOTAL_ALL = 2554;   // 사진 2,418 + 영상 136 (앨범 열림 화면과 같은 숫자)

function analysisData() {
  if (App.state.access === 'some') {
    var n = App.state.picked || 14, a = Math.ceil(n * .4), b = Math.floor(n * .3);
    if (n < 10) return { total: n, partial: true, trips: [] };   // one or two picks: nothing that reads as a trip
    return { total: n, partial: true, trips: [
      { key: '제주', place: '제주', date: '2026. 7. 14', days: '당일', n: a, c: '#2f7fd8' },
      { key: '제주', place: '제주', date: '2026. 7. 19', days: '당일', n: b, c: '#2bae8e' },
    ] };
  }
  return { total: TOTAL_ALL, partial: false, trips: TRIPS_ALL };
}
function ticket(t, drop, k) {   // k given → a tappable ticket that opens that trip
  var tag = k == null ? 'div' : 'button';
  return '<' + tag + ' class="tk' + (drop ? ' drop' : '') + '"' + (k == null ? '' : ' data-action="openTrip" data-k="' + k + '" data-links="trip"') + '><i class="tk-dot" style="--c:' + t.c + '"></i>' +
    '<span class="tk-main"><b>' + t.place + '</b><span>' + t.date + ' · ' + t.days + '</span></span>' +
    '<span class="tk-n num">' + fmt(t.n) + '장</span></' + tag + '>';
}

/* ── trip globe: same sphere as the album globe; p (0…1) = how far the analysis has got ── */
function TripGlobe(canvasId, screenId) {
  var cv = document.getElementById(canvasId), ctx = cv.getContext('2d');
  var S = cv.width, C = S / 2, R = S * .4, U = S / 720;
  var PAPER = [246, 241, 233], GHOST = [214, 202, 185], INK = [58, 50, 43], SUN = [242, 179, 61], DIM = [176, 164, 150];
  var rnd = seeded(23), N = 280, ga = Math.PI * (3 - Math.sqrt(5)), pts = [];
  for (var i = 0; i < N; i++) {
    var y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = ga * i;
    pts.push({ v: [Math.cos(th) * r, y, Math.sin(th) * r], ph: rnd() * 6.28, s: .8 + rnd() * .45, sc: .4 + rnd(), pick: rnd() });
  }
  function norm(v) { var l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }
  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = clamp(x); return x * x * (3 - 2 * x); }
  function mix(a, b, f) { return 'rgb(' + a.map(function (x, i) { return Math.round(x + (b[i] - x) * f); }).join(',') + ')'; }
  function lerp3(a, b, f) { return a.map(function (x, i) { return x + (b[i] - x) * f; }); }
  var CENTERS = [[.75, .35, .55], [-.6, .55, .55], [.15, -.75, .65], [-.55, -.45, -.7], [.6, .5, -.62], [-.95, .05, -.1], [.2, .15, .97], [-.2, .9, .3], [.4, -.3, -.85], [-.7, -.7, .2], [.85, -.35, .1]].map(norm);
  var trips = [], visible = N, p = 0, rot = .4, scatter = 0, focus = -1, fAmt = 0, proj = [], onPick = null;
  // assign dots: the nearest trip centre within reach becomes that trip; the rest stay ink (everyday photos)
  function setup(data) {
    trips = data.trips.map(function (t, k) { return { rgb: hex(t.c), at: .28 + k * (.62 / data.trips.length), c: CENTERS[(k + (data.partial ? 6 : 0)) % CENTERS.length] }; });
    if (data.partial && trips[1]) { trips[1].c = norm([.55, .55, .62]); }
    visible = data.partial ? Math.max(12, Math.round(N * .16)) : N;
    var order = pts.slice().sort(function (a, b) { return a.pick - b.pick; });
    pts.forEach(function (q) { q.lit = 0; q.trip = -1; });
    order.slice(0, visible).forEach(function (q) { q.lit = 1; });
    pts.forEach(function (q) {
      if (!q.lit) return;
      var best = -1, bd = data.partial ? .55 : .86;
      trips.forEach(function (t, k) { var d = t.c[0] * q.v[0] + t.c[1] * q.v[1] + t.c[2] * q.v[2]; if (d > bd) { bd = d; best = k; } });
      q.trip = best;
    });
  }
  function draw(dt, t) {
    if (focus >= 0 && trips[focus]) {                          // turn the focused trip's cluster to the front
      var fc = trips[focus].c, want = Math.atan2(fc[0], fc[2]), dr = want - rot;
      dr = Math.atan2(Math.sin(dr), Math.cos(dr));
      rot += dr * Math.min(1, dt * 3.2);
    } else rot += dt * (p >= 1 ? .2 : .32);
    fAmt += ((focus >= 0 ? 1 : 0) - fAmt) * Math.min(1, dt * 3);
    scatter *= Math.pow(.12, dt);
    ctx.clearRect(0, 0, S, S);
    var cr = Math.cos(rot), sr = Math.sin(rot), ca = Math.cos(.38), sa = Math.sin(.38), list = [];
    var read = 1 - clamp((p - .3) / .1);                       // time sweep fades out as places come in
    pts.forEach(function (q) {
      var tr = q.trip >= 0 ? trips[q.trip] : null;
      var tint = tr ? ease((p - tr.at + .1) / .1) : 0;         // dot takes its trip colour …
      var pull = tr ? ease((p - tr.at + .02) / .08) * .62 : 0;  // … then the cluster pulls together and merges
      var v = tr ? norm(lerp3(q.v, tr.c, pull)) : q.v;
      var rr = 1 + .03 * Math.sin(t * 1.4 + q.ph) + scatter * q.sc * .5;
      var x = v[0] * cr - v[2] * sr, z = v[0] * sr + v[2] * cr, y = v[1] * ca - z * sa; z = v[1] * sa + z * ca;
      var d = (z + 1) / 2;
      var wave = q.lit ? Math.max(0, Math.sin(t * 2.6 - q.v[1] * 4.5)) * read : 0;
      var base = q.lit ? lerp3(INK, SUN, wave) : GHOST;
      var calm = !tr && q.lit ? ease((p - .5) / .2) : 0;        // everyday photos fade back to a soft grey
      var rgb = tr ? lerp3(base, tr.rgb, tint) : lerp3(base, DIM, calm);
      if (tr && q.trip !== focus) rgb = lerp3(rgb, DIM, .62 * fAmt);   // other trips step back
      var size = 15 * U * q.s * (.45 + .7 * d) * (1 + wave * .3) * (1 + pull * .7);
      list.push({ x: C + x * R * rr, y: C + y * R * rr, z: z, size: size, col: mix(rgb, PAPER, Math.min(.8, (1 - d) * .6)) });
    });
    list.sort(function (a, b) { return a.z - b.z; });
    list.forEach(function (o) { ctx.beginPath(); ctx.fillStyle = o.col; ctx.arc(o.x, o.y, o.size, 0, 6.2832); ctx.fill(); });
    proj = trips.map(function (tr) {                            // where each cluster sits on screen, for tapping
      var v = tr.c, x = v[0] * cr - v[2] * sr, z = v[0] * sr + v[2] * cr, y = v[1] * ca - z * sa; z = v[1] * sa + z * ca;
      return { x: C + x * R, y: C + y * R, z: z };
    });
  }
  cv.addEventListener('click', function (e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * S / r.width, y = (e.clientY - r.top) * S / r.height, best = -1, bd = (S * .16) * (S * .16);
    if (onPick) proj.forEach(function (o, k) { var d = (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y); if (o.z > -.1 && d < bd) { bd = d; best = k; } });
    if (best >= 0) onPick(best); else scatter = 1.1;
  });
  App.loop(screenId, draw);
  return { setup: setup, set: function (v) { p = v; }, draw: function () { draw(.016, 1); }, trips: function () { return trips; },
    focus: function (k, snap) { focus = k; if (snap && k >= 0 && trips[k]) { rot = Math.atan2(trips[k].c[0], trips[k].c[2]); fAmt = 1; } },
    pick: function (fn) { onPick = fn; } };
}
var TG = { run: TripGlobe('tg-run', 'analyze'), done: TripGlobe('tg-done', 'found'), none: TripGlobe('tg-none', 'nofound') };

/* ── analyze: ~9s of progress told as a story, then on to the result ── */
var STATUS = [
  { until: .3, b: 'tick', t: '틱이 사진을 찍은 순서대로 읽고 있어요' },
  { until: .55, b: 'pin', t: '핀이 사진 속 장소를 살펴보고 있어요' },
  { until: 1.01, b: 'both', t: '같은 여행의 사진끼리 모으고 있어요' },
];
var anRun = 0;
function setStatus(i) {
  var s = STATUS[i], el = document.getElementById('an-status');
  if (el.getAttribute('data-i') === String(i)) return;
  el.setAttribute('data-i', i);
  var av = s.b === 'both' ? '<span class="cast"><svg class="bot"><use href="#bot-tick"/></svg><svg class="bot b2"><use href="#bot-pin"/></svg></span>'
    : '<svg class="bot' + (s.b === 'pin' ? ' b2' : '') + '" aria-hidden="true"><use href="#bot-' + s.b + '"/></svg>';
  el.innerHTML = av + '<span>' + s.t + '</span>';
}
function renderProgress(data, p, shown) {
  var read = Math.min(1, p / .92);
  document.getElementById('an-bar').style.width = (read * 100).toFixed(1) + '%';
  document.getElementById('an-count').textContent = fmt(Math.round(data.total * read)) + ' / ' + fmt(data.total);
  var i = 0; while (p > STATUS[i].until) i++; setStatus(i);
  var trips = TG.run.trips(), list = document.getElementById('an-list');
  while (shown.n < trips.length && p >= trips[shown.n].at) {
    if (!shown.n) list.innerHTML = '';
    list.insertAdjacentHTML('afterbegin', ticket(data.trips[shown.n], !App.shot));
    shown.n++;
    var tks = list.querySelectorAll('.tk'); if (tks.length > 4) tks[tks.length - 1].remove();   // newest four stay in view
  }
  document.getElementById('an-n').textContent = shown.n;
}
App.onEnter('analyze', function (s) {
  fillNick(s);
  var run = ++anRun, data = analysisData(), shown = { n: 0 };
  TG.run.setup(data);
  document.getElementById('an-list').innerHTML = '<div class="an-empty">아직 찾는 중이에요</div>';
  document.getElementById('an-status').removeAttribute('data-i');
  if (App.shot) { TG.run.set(.66); renderProgress(data, .66, shown); TG.run.draw(); return; }   // still: mid-story, 4 trips in
  var DUR = App.reducedMotion ? 1 : 9.5, t0 = performance.now();
  (function tick() {
    if (run !== anRun || App.current() !== 'analyze') return;
    var p = Math.min(1, (performance.now() - t0) / 1000 / DUR);
    TG.run.set(p); renderProgress(data, p, shown);
    if (p < 1) return requestAnimationFrame(tick);
    setTimeout(function () { if (run === anRun && App.current() === 'analyze') App.go(data.trips.length ? 'found' : 'nofound'); }, 1100);
  })();
});
App.onLeave('analyze', function () { anRun++; });

/* ── found: the finished globe + the newest trips; back skips the analysis screen ── */
function skipAnalyzeOnBack(id) {
  setTimeout(function () {
    var i = App.stack.lastIndexOf('analyze');
    if (i >= 0 && App.current() === id) App.stack.splice(i, 1);
  }, 0);
}
App.onEnter('found', function () {
  skipAnalyzeOnBack('found');
  var data = analysisData(), trips = data.trips, sum = trips.reduce(function (a, t) { return a + t.n; }, 0);
  TG.done.setup(data); TG.done.set(1); TG.done.draw();
  document.getElementById('fd-h').innerHTML = (data.partial ? '고르신 사진에서<br>' : (App.state.nick ? esc(App.state.nick) + '님의 ' : '')) +
    '여행 <em>' + trips.length + '개</em>를' + (data.partial ? ' ' : '<br>') + '찾았어요';
  document.getElementById('fd-sub').innerHTML = data.partial
    ? '고르신 ' + fmt(data.total) + '장 중 <b>' + fmt(sum) + '장</b>이 여행에 담겼어요.'
    : '사진·영상 ' + fmt(data.total) + '개 중 <b>' + fmt(sum) + '개</b>가 여행에 담겼어요. 나머지는 앨범에 그대로 있어요.';
  var newest = trips.slice().reverse(), top = newest.slice(0, 3);
  document.getElementById('fd-list').innerHTML = top.map(function (t) { return ticket(t, false, trips.indexOf(t)); }).join('') +
    (newest.length > 3 ? '<div class="tk-more">그 밖에 여행 ' + (newest.length - 3) + '개가 더 있어요</div>' : '');
  document.getElementById('fd-cut').hidden = !data.partial;
  document.getElementById('fd-more').hidden = !data.partial;
});
/* ── nofound: nothing became a trip — say what the user can do, not how Wend decides ── */
App.onEnter('nofound', function () {
  skipAnalyzeOnBack('nofound');
  var data = analysisData();
  TG.none.setup({ total: data.total, partial: data.partial, trips: [] }); TG.none.set(1); TG.none.draw();
  document.getElementById('nf-sub').textContent = data.partial
    ? '고르신 ' + fmt(data.total) + '장으로는 여행을 찾기 어려웠어요.'
    : '사진·영상 ' + fmt(data.total) + '개를 모두 읽었지만 여행으로 묶을 사진이 없었어요.';
  document.getElementById('nf-bub').textContent = data.partial
    ? '여행은 사진이 여러 장 이어져야 보여요. 모든 사진을 허용해 주시면 처음부터 다시 찾아볼게요.'
    : '사진에 위치가 남아 있지 않으면 여행을 찾기 어려워요. 카메라에서 위치 태그를 켜 두시면 다음 여행부터 찾아 드릴게요.';
  document.getElementById('nf-steps').hidden = data.partial;
  document.getElementById('nf-cta').hidden = data.partial;
  document.getElementById('nf-more').hidden = !data.partial;
  document.getElementById('nf-skip').hidden = !data.partial;
});
App.actions.startAnalysis = function () { App.go('analyze'); };
</script>
