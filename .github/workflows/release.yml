name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json 복원
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: 키스토어 복원
        run: echo "${{ secrets.WEND_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/key.jks"

      - name: 릴리스 AAB 빌드
        env:
          WEND_KEYSTORE_PATH: ${{ runner.temp }}/key.jks
          WEND_KEYSTORE_PASSWORD: ${{ secrets.WEND_KEYSTORE_PASSWORD }}
          WEND_KEY_ALIAS: ${{ secrets.WEND_KEY_ALIAS }}
          WEND_KEY_PASSWORD: ${{ secrets.WEND_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: 릴리스 AAB 보관
        uses: actions/upload-artifact@v7
        with:
          name: wend-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error